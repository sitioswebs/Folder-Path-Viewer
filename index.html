<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folder Path Viewer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="icon.png">
</head>
<body>
    <main class="hero" id="hero">
        <h1 class="hero__title">Folder Path Viewer</h1>

        <button class="hero__button" id="button">Copy Output</button>
    </main>
    <script src="main.js"></script>
</body>
</html>
